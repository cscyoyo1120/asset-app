<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>자산관리</title>
  <meta name="theme-color" content="#F2F4F6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <header>
    <div class="brand">자산관리</div>
    <span id="status"></span>
    <button id="menuBtn" class="icon" aria-label="설정">⋯</button>
  </header>

  <div id="banner" hidden>
    구글 시트 연결이 끊겼어요. <button id="reconnect">다시 연결</button>
  </div>

  <main id="main"></main>

  <nav id="tabs">
    <button data-tab="dash" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>대시보드</button>
    <button data-tab="assets"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M16 15h1"/></svg>자산</button>
    <button data-tab="expenses"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>고정</button>
    <button data-tab="invest"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>주식</button>
  </nav>

  <!-- 첫 화면 -->
  <dialog id="welcome">
    <h2>자산관리</h2>
    <p>데이터는 <b>내 구글 드라이브의 시트</b>에만 저장돼요.<br />앱이 만든 파일 외에는 접근하지 않아요.</p>
    <button class="primary" id="loginBtn">구글로 시작하기</button>
    <button class="ghost" id="localBtn">로그인 없이 체험 (이 기기에만 저장)</button>
  </dialog>

  <!-- 항목 편집 -->
  <dialog id="editor">
    <form method="dialog" id="editForm">
      <h3 id="editTitle"></h3>
      <div id="editFields"></div>
      <div class="row">
        <button type="button" class="danger" id="delBtn">삭제</button>
        <span class="grow"></span>
        <button value="cancel" formnovalidate class="ghost">취소</button>
        <button value="ok" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 설정 -->
  <dialog id="menu">
    <form method="dialog">
      <h3>설정</h3>
      <p id="modeInfo" class="muted"></p>
      <a id="openSheet" target="_blank" rel="noopener" class="btn ghost">구글 시트에서 열기</a>
      <button type="button" id="syncBtn" class="ghost">구글 시트에서 불러오기</button>
      <button type="button" id="connectBtn" class="primary">구글 로그인 (체험 데이터를 시트에 저장)</button>
      <button type="button" id="logoutBtn" class="danger">로그아웃 (이 기기 데이터 지우기)</button>
      <button value="close" class="ghost">닫기</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
